name: Waka Readme

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

jobs:
  update-readmes:
    name: WakaReadme All READMEs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # Fail fast with a clear message instead of letting waka-readme retry
      # for ~5 minutes and exit with "Unable to fetch data".
      - name: Check WakaTime API access
        id: precheck
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          if [ -z "$WAKATIME_API_KEY" ]; then
            echo "::warning::WAKATIME_API_KEY is not set; skipping WakaTime update"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=$(curl -sS -o body.json -w '%{http_code}' --max-time 30 \
            -u "${WAKATIME_API_KEY}:" \
            https://wakatime.com/api/v1/users/current/stats/last_7_days || echo 000)
          echo "WakaTime API status: $status"
          head -c 500 body.json 2>/dev/null; echo
          rm -f body.json
          case "$status" in
            200|202)
              echo "ok=true" >> "$GITHUB_OUTPUT" ;;
            401|403)
              echo "::error::WakaTime API returned $status. WAKATIME_API_KEY is invalid or revoked. Regenerate it at https://wakatime.com/settings/api-key and update the repository secret."
              exit 1 ;;
            *)
              echo "::warning::WakaTime API returned $status (likely transient); skipping today's update"
              echo "ok=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Update English README
        if: steps.precheck.outputs.ok == 'true'
        uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          BLOCKS: " █"

      - name: Fix bar alignment and sync to JA/ZH READMEs
        if: steps.precheck.outputs.ok == 'true'
        run: |
          python3 - <<'EOF'
          import re

          MARKER_START = "<!--START_SECTION:waka-->"
          MARKER_END   = "<!--END_SECTION:waka-->"

          with open("README.md", encoding="utf-8") as f:
              src = f.read()

          m = re.search(
              re.escape(MARKER_START) + r"(.*?)" + re.escape(MARKER_END),
              src, re.DOTALL
          )
          if not m:
              raise SystemExit("Waka section not found in README.md")

          # Fix rendering: replace partial/shade block chars with full block or space
          # ▓ (U+2593) → █ (U+2588), ▒ (U+2592) → space, ░ (U+2591) → space
          section_body = m.group(1).replace("▓", "█").replace("▒", " ").replace("░", " ")
          waka_block = MARKER_START + section_body + MARKER_END

          # Apply fix to README.md as well
          fixed_src = src[:m.start()] + waka_block + src[m.end():]
          with open("README.md", "w", encoding="utf-8") as f:
              f.write(fixed_src)
          print("Fixed README.md")

          for path in ["README.ja.md", "README.zh.md"]:
              with open(path, encoding="utf-8") as f:
                  content = f.read()
              updated = re.sub(
                  re.escape(MARKER_START) + r".*?" + re.escape(MARKER_END),
                  waka_block,
                  content,
                  flags=re.DOTALL
              )
              with open(path, "w", encoding="utf-8") as f:
                  f.write(updated)
              print(f"Updated {path}")
          EOF

      - name: Commit and push all changes
        if: steps.precheck.outputs.ok == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md README.ja.md README.zh.md
          git diff --cached --quiet || git commit -m "Update READMEs with WakaTime stats"
          git pull --rebase origin main
          git push
