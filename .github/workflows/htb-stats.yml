name: HackTheBox Stats

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  update-readmes:
    name: Update HTB section in all READMEs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Fetch HTB profile and render section
        env:
          HTB_APP_TOKEN: ${{ secrets.HTB_APP_TOKEN }}
        run: python3 .github/scripts/htb_stats.py

      - name: Commit and push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md README.ja.md README.zh.md
          git diff --cached --quiet && exit 0
          git commit -m "Update READMEs with HackTheBox stats"
          git pull --rebase origin main
          git push
